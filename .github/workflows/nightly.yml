# Nightly: rebuilds the rolling `nightly` prerelease from main once a day when main has changed
# (or on demand), for people who pick the Nightly update channel. See docs/updates.md.
name: Nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if main hasn't changed
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nightly

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/manifest.json" 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' 2>/dev/null || true)
          if [ "$built" = "$GITHUB_SHA" ] && [ "${{ inputs.force }}" != true ]; then
            echo "main ($GITHUB_SHA) is already the nightly"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The next patch version, with the build time as semver build metadata so packages sort in order.
          IFS=. read -r major minor patch < VERSION
          version="$major.$minor.$((patch + 1))+nightly.$(date -u +%Y%m%d%H%M)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          notes="Built from [\`${GITHUB_SHA:0:7}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) on $(date -u '+%Y-%m-%d %H:%M UTC'). Nightly builds have the newest changes and may have rough edges. Pick the channel in Shotate's Settings, or install with \`SHOTATE_CHANNEL=nightly\` (see the README)."
          gh release create nightly --prerelease --target "$GITHUB_SHA" --title "Shotate Nightly $version" --notes "$notes"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: nightly
      channel: nightly
      version: ${{ needs.prepare.outputs.version }}
