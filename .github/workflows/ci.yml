name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build the app (universal)
        run: scripts/bundle.sh
      - name: Render self-test
        run: |
          build/Snap.app/Contents/MacOS/Snap --selftest Tests/Fixtures/sample.png build/selftest.png
          test -s build/selftest.png
      - uses: actions/upload-artifact@v4
        with:
          name: Snap.app
          path: build/Snap.app
