# Builds every installer for a release (stable or nightly), uploads them, then writes the
# manifest.json the apps read to find updates (see docs/updates.md). Called by release.yml and nightly.yml.
name: Build
on:
  workflow_call:
    inputs:
      tag:
        description: The release to upload to (vX.Y.Z or nightly)
        type: string
        required: true
      channel:
        description: stable or nightly
        type: string
        required: true
      version:
        description: Version to stamp into the Windows and Linux builds; empty keeps the files' version
        type: string
        default: ''
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: swift test
      - name: Build the app (universal)
        run: scripts/bundle.sh
        env:
          SHOTATE_ADHOC: 1
          SHOTATE_CHANNEL: ${{ inputs.channel }}
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          zip="Shotate-${tag#v}-macOS.zip"
          ditto -c -k --keepParent build/Shotate.app "$zip"
          gh release upload "${{ inputs.tag }}" "$zip" --clobber

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      SHOTATE_COMMIT: ${{ github.sha }}
      SHOTATE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libwayland-dev libegl-dev libgbm-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp the version
        if: inputs.version != ''
        shell: bash
        run: |
          npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"
          sed -i.bak '0,/^version = ".*"/s//version = "${{ inputs.version }}"/' src-tauri/Cargo.toml && rm src-tauri/Cargo.toml.bak
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        shell: bash
        run: |
          export SHOTATE_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # MSI needs a plain numeric version, so nightly builds skip it.
          if [ "${{ inputs.channel }}" = nightly ]; then
            if [ "$RUNNER_OS" = Windows ]; then npx tauri build --bundles nsis; else npx tauri build --bundles deb,rpm,appimage; fi
          else
            npx tauri build
          fi
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/{nsis/*.exe,msi/*.msi,appimage/*.AppImage,deb/*.deb,rpm/*.rpm})
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber

  manifest:
    needs: [macos, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write and upload manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version=$(cat VERSION)
          .github/scripts/manifest.sh "${{ inputs.tag }}" "${{ inputs.channel }}" "$version" "${{ github.sha }}"
