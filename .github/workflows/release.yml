name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A draft until every installer is attached, so `releases/latest` never points at an empty one.
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="## $v" '$0 ~ "^"v {on=1; next} /^## / && on {exit} on' CHANGELOG.md)
          notes="$notes"$'\n\n'"## Install"$'\n\n'"- **macOS:** \`curl -fsSL https://raw.githubusercontent.com/baney75/shotate/main/install.sh | bash\` (builds on your Mac so it is trusted and keeps its permission). The zip below is ad-hoc signed; right-click › Open on first launch."$'\n'"- **Windows:** \`irm https://raw.githubusercontent.com/baney75/shotate/main/install.ps1 | iex\`, or run the Setup .exe below."$'\n'"- **Linux:** \`curl -fsSL https://raw.githubusercontent.com/baney75/shotate/main/install.sh | bash\`, or pick the .deb, .rpm or .AppImage below."
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "Shotate $v" --notes "$notes"

  build:
    needs: create
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
      channel: stable

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
