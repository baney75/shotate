name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build the app (universal)
        run: scripts/bundle.sh
        env:
          SNAPMARK_ADHOC: 1
      - name: Package
        run: ditto -c -k --keepParent build/Snapmark.app "Snapmark-${GITHUB_REF_NAME#v}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0 ~ "^"v {on=1; next} /^## / && on {exit} on' CHANGELOG.md)
          notes="$notes"$'\n\n'"**Recommended:** install with the one-line installer in the README, which builds on your Mac so macOS trusts it and remembers its permission. The zip is ad-hoc signed; on first open, right-click Snapmark and choose Open."
          gh release create "$GITHUB_REF_NAME" "Snapmark-${GITHUB_REF_NAME#v}.zip" --title "Snapmark ${GITHUB_REF_NAME#v}" --notes "$notes" \
            || gh release upload "$GITHUB_REF_NAME" "Snapmark-${GITHUB_REF_NAME#v}.zip" --clobber
